[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-networks-from-scratch"
version = "0.1.0"
description = "A clean, from-scratch deep learning implementation in NumPy: obtaining MNIST, training a neural network, validating, testing, and visualizing learning dynamics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Soorya Narayan" }
]
keywords = [
    "deep-learning",
    "neural-networks",
    "mnist",
    "numpy",
    "machine-learning",
    "from-scratch"
]
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
    "torch>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
