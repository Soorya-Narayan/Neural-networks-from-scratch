site_name: Neural Networks from Scratch
site_description: A textbook-style guide to deep learning from first principles.
site_author: Soorya Narayan
repo_url: https://github.com/Soorya-Narayan/Neural-networks-from-scratch
repo_name: Soorya-Narayan/Neural-networks-from-scratch

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Chapters:
      - "00. Setup and Math Refresher": chapters/00-setup-and-math.md
      - "01. The Neuron (Linear & Logistic)": chapters/01-the-neuron.md
  - Roadmap: roadmap.md
